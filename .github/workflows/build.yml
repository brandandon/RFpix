# Tests and builds RFpix for Windows on GitHub's servers every time code is pushed.
# The finished program can be downloaded from the run's Summary page,
# under "Artifacts" (you need to be signed in to GitHub to download it).
#
# A version tag (e.g. v0.2.0) also makes a public Release: RFpix.exe for anyone to download,
# with docs/TESTING.md as its instructions. To make one: GitHub > Releases > "Draft a new
# release", type a new tag such as v0.2.0, and Publish; a few minutes later RFpix.exe is
# attached. The newest is always at https://github.com/brandandon/RFpix/releases/latest

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to make a Release when a version tag is pushed

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # If any test fails, the build stops here and no new RFpix.exe is made.
      - name: Run the tests (uses the recordings in tests/recordings)
        run: dotnet test tests/RFpix.Tests/RFpix.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results

      # If a test failed, list it (with its message) at the top of the run's page.
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem test-results -Filter *.trx -Recurse) {
            [xml]$trx = Get-Content $file.FullName
            foreach ($r in $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
              $message = ($r.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              Write-Output "::error title=Test failed: $($r.testName)::$message"
            }
          }

      - name: Build RFpix (one self-contained RFpix.exe, for running without installing)
        run: >
          dotnet publish src/RFpix/RFpix.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Build RFpix as a folder of files (for the installer)
        run: >
          dotnet publish src/RFpix/RFpix.csproj
          -c Release -r win-x64 --self-contained true
          -o publish-folder

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = ([xml](Get-Content src/RFpix/RFpix.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $iscc /Q "/DAppVersion=$version" installer/RFpix.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer didn't build." }
          Get-ChildItem installer-output

      # Install into a test folder, check the files arrived, then uninstall and check they're gone.
      - name: Test the installer and uninstaller
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-output -Filter RFpix-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "RFpix install test"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`"" -Wait
          foreach ($f in "RFpix.exe", "libhamlib-4.dll", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "After installing, $f is missing." }
          }
          Write-Output "Installed: $((Get-ChildItem $dir -Recurse -File).Count) files"
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller finishes in a copy of itself, so allow it a little time.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "RFpix.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir "RFpix.exe")) { throw "After uninstalling, RFpix.exe is still there." }
          Write-Output "Uninstalled cleanly."

      - name: Keep the program for download
        uses: actions/upload-artifact@v6
        with:
          name: RFpix-windows-x64
          path: |
            publish/RFpix.exe
            installer-output/RFpix-Setup-*.exe

      - name: Publish a Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @((Get-ChildItem installer-output -Filter RFpix-Setup-*.exe).FullName, "publish/RFpix.exe")
          # The release may already exist (made on GitHub's Releases page, which also makes the
          # tag): then attach the files, and add the tester instructions below its own description.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            $body = gh release view $tag --json body --jq .body
            if ($body -notmatch 'Testing RFpix on the air') {
              $notes = ($body + "`n`n" + (Get-Content docs/TESTING.md -Raw)).Trim()
              Set-Content -Path release-notes.md -Value $notes -Encoding utf8
              gh release edit $tag --notes-file release-notes.md
            }
          } else {
            gh release create $tag @files --title "RFpix $tag" --notes-file docs/TESTING.md
          }
