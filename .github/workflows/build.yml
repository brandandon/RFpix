# Tests and builds RFpix for Windows on GitHub's servers every time code is pushed.
# The finished program can be downloaded from the run's Summary page,
# under "Artifacts" (you need to be signed in to GitHub to download it).
#
# A version tag (e.g. v0.2.0) also makes a public Release: RFpix.exe for anyone to download,
# with docs/TESTING.md as its instructions. To make one: GitHub > Releases > "Draft a new
# release", type a new tag such as v0.2.0, and Publish; a few minutes later RFpix.exe is
# attached. The newest is always at https://github.com/brandandon/RFpix/releases/latest

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to make a Release when a version tag is pushed

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # If any test fails, the build stops here and no new RFpix.exe is made.
      - name: Run the tests (uses the recordings in tests/recordings)
        run: dotnet test tests/RFpix.Tests/RFpix.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results

      # If a test failed, list it (with its message) at the top of the run's page.
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem test-results -Filter *.trx -Recurse) {
            [xml]$trx = Get-Content $file.FullName
            foreach ($r in $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
              $message = ($r.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              Write-Output "::error title=Test failed: $($r.testName)::$message"
            }
          }

      - name: Build RFpix (one self-contained RFpix.exe)
        run: >
          dotnet publish src/RFpix/RFpix.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Keep the program for download
        uses: actions/upload-artifact@v4
        with:
          name: RFpix-windows-x64
          path: publish/RFpix.exe

      - name: Publish a Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # The release may already exist (made on GitHub's Releases page, which also makes the
          # tag): then attach RFpix.exe and the tester instructions to it.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/RFpix.exe --clobber
            gh release edit $tag --title "RFpix $tag" --notes-file docs/TESTING.md
          } else {
            gh release create $tag publish/RFpix.exe --title "RFpix $tag" --notes-file docs/TESTING.md
          }
