# Tests and builds RFpix for Windows, the Mac and Linux on GitHub's servers every time code is pushed.
# The finished program can be downloaded from the run's Summary page,
# under "Artifacts" (you need to be signed in to GitHub to download it).
#
# A version tag (e.g. v0.2.0) also makes a public Release: RFpix.exe, the Windows installer, the
# two Mac installers (Intel and Apple Silicon) and the Linux AppImages and .debs (PCs and
# Raspberry Pi) for anyone to download, with docs/TESTING.md as its instructions. To make one: GitHub > Releases > "Draft a new
# release", type a new tag such as v0.2.0, and Publish; a few minutes later RFpix.exe is
# attached. The newest is always at https://github.com/brandandon/RFpix/releases/latest

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to make a Release when a version tag is pushed

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # If any test fails, the build stops here and no new RFpix.exe is made.
      - name: Run the tests (uses the recordings in tests/recordings)
        run: dotnet test tests/RFpix.Tests/RFpix.Tests.csproj -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results

      # How many tests ran and passed, at the top of the run's page.
      - name: Count the tests
        if: always()
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem test-results -Filter *.trx -Recurse) {
            [xml]$trx = Get-Content $file.FullName
            $c = $trx.TestRun.ResultSummary.Counters
            $layout = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.testName -like '*FitToWindowTests*' -and $_.outcome -eq 'Passed' }).Count
            Write-Output "::notice title=Tests::$($c.passed) of $($c.total) passed ($layout screen-layout tests)"
          }

      # If a test failed, list it (with its message) at the top of the run's page.
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem test-results -Filter *.trx -Recurse) {
            [xml]$trx = Get-Content $file.FullName
            foreach ($r in $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
              $message = ($r.Output.ErrorInfo.Message -replace '\r?\n', ' ')
              Write-Output "::error title=Test failed: $($r.testName)::$message"
            }
          }

      - name: Build RFpix (one self-contained RFpix.exe, for running without installing)
        run: >
          dotnet publish src/RFpix/RFpix.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Build RFpix as a folder of files (for the installer)
        run: >
          dotnet publish src/RFpix/RFpix.csproj
          -c Release -r win-x64 --self-contained true
          -o publish-folder

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = ([xml](Get-Content src/RFpix/RFpix.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $iscc /Q "/DAppVersion=$version" installer/RFpix.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer didn't build." }
          Get-ChildItem installer-output

      # Install into a test folder, check the files arrived, then uninstall and check they're gone.
      - name: Test the installer and uninstaller
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-output -Filter RFpix-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "RFpix install test"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`"" -Wait
          foreach ($f in "RFpix.exe", "libhamlib-4.dll", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "After installing, $f is missing." }
          }
          Write-Output "Installed: $((Get-ChildItem $dir -Recurse -File).Count) files"
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller finishes in a copy of itself, so allow it a little time.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "RFpix.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir "RFpix.exe")) { throw "After uninstalling, RFpix.exe is still there." }
          Write-Output "Uninstalled cleanly."

      - name: Keep the program for download
        uses: actions/upload-artifact@v6
        with:
          name: RFpix-windows-x64
          path: |
            publish/RFpix.exe
            installer-output/RFpix-Setup-*.exe

      - name: Publish a Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @((Get-ChildItem installer-output -Filter RFpix-Setup-*.exe).FullName, "publish/RFpix.exe")
          # The release may already exist (made on GitHub's Releases page, which also makes the
          # tag): then attach the files, and add the tester instructions below its own description.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            $body = gh release view $tag --json body --jq .body
            if ($body -notmatch 'Testing RFpix on the air') {
              $notes = ($body + "`n`n" + (Get-Content docs/TESTING.md -Raw)).Trim()
              Set-Content -Path release-notes.md -Value $notes -Encoding utf8
              gh release edit $tag --notes-file release-notes.md
            }
          } else {
            gh release create $tag @files --title "RFpix $tag" --notes-file docs/TESTING.md
          }

  # The Mac: one installer for each kind of Mac, each built and tested on a Mac of that kind.
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            kind: apple-silicon
            runner: macos-15
          - arch: x64
            kind: intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Publishes RFpix, builds Hamlib 4.7.2 from source, makes RFpix.app and the installer.
      # If it fails, the last lines of its output are shown at the top of the run's page.
      - name: Build the Mac installer
        run: |
          set -o pipefail
          tools/mac/package.sh ${{ matrix.arch }} 2>&1 | tee package.log || {
            tail -n 60 package.log | python3 -c '
          import sys
          lines = [l.rstrip() for l in sys.stdin]
          for i in range(0, len(lines), 15):
              text = "\n".join(lines[i:i + 15]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Mac build failed (lines {i + 1}-{i + 15} of the last 60)::{text}")
          '
            exit 1
          }

      # The tests use the same Hamlib that goes into the installer.
      - name: Run the tests
        run: |
          dotnet build tests/RFpix.Tests/RFpix.Tests.csproj -c Release
          for dir in tests/RFpix.Tests/bin/Release/*/; do cp build/mac-${{ matrix.arch }}/publish/libhamlib.4.dylib "$dir"; done
          dotnet test tests/RFpix.Tests/RFpix.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Count the tests
        if: always()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("test-results/**/*.trx", recursive=True):
              root = ET.parse(f).getroot()
              c = root.find("t:ResultSummary/t:Counters", ns)
              failed = [r for r in root.iterfind(".//t:UnitTestResult", ns) if r.get("outcome") == "Failed"]
              print(f"::notice title=Mac (${{ matrix.kind }}) tests::{c.get('passed')} of {c.get('total')} passed")
              for r in failed:
                  m = r.find(".//t:Message", ns)
                  text = (m.text or "").replace("\n", " ") if m is not None else ""
                  print(f"::error title=Mac test failed: {r.get('testName')}::{text}")

      # Install it, check RFpix.app arrived, start it for a moment, then install it again on
      # top (as an update does) and check it's still there.
      - name: Test the installer
        run: |
          pkg=$(ls dist/RFpix-*-mac-${{ matrix.kind }}.pkg)
          sudo installer -pkg "$pkg" -target /
          for f in RFpix libhamlib.4.dylib RFpix.dll; do
            test -f "/Applications/RFpix.app/Contents/MacOS/$f" || { echo "::error::After installing, $f is missing."; exit 1; }
          done
          codesign --verify --deep --strict /Applications/RFpix.app
          /Applications/RFpix.app/Contents/MacOS/RFpix > rfpix-start.log 2>&1 &
          sleep 20
          if kill -0 $! 2>/dev/null; then echo "RFpix started and kept running."; kill $!; sleep 2
          else echo "::warning title=Mac start-up::RFpix stopped within 20 seconds (this runner may have no screen):"; cat rfpix-start.log; fi
          sudo installer -pkg "$pkg" -target /
          test -f /Applications/RFpix.app/Contents/MacOS/RFpix || { echo "::error::Installing again (an update) lost RFpix.app."; exit 1; }
          echo "Installed twice cleanly."

      - name: Keep the installer for download
        uses: actions/upload-artifact@v6
        with:
          name: RFpix-mac-${{ matrix.kind }}
          path: dist/RFpix-*-mac-${{ matrix.kind }}.pkg

      # The release is made on GitHub's Releases page (or by the Windows job): wait for it to
      # exist, then attach this installer.
      - name: Add to the Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          for i in $(seq 1 60); do
            gh release view "$tag" > /dev/null 2>&1 && break
            echo "Waiting for the release $tag to exist..."; sleep 30
          done
          gh release upload "$tag" dist/RFpix-*-mac-${{ matrix.kind }}.pkg --clobber

  # Linux: an AppImage and a .deb for 64-bit PCs and for the Raspberry Pi (64-bit), each built and
  # tested on a computer of that kind. Built on Ubuntu 22.04, so they run on it and anything newer.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb: amd64
            runner: ubuntu-22.04
          - arch: arm64
            deb: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install the build tools, a sound server for the tests, and a screen for trying it
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pulseaudio xvfb libfontconfig1 libice6 libsm6 libx11-6

      # Publishes RFpix, builds Hamlib 4.7.2 from source, makes the AppImage and the .deb.
      # If it fails, the last lines of its output are shown at the top of the run's page.
      - name: Build the AppImage and the .deb
        run: |
          set -o pipefail
          tools/linux/package.sh ${{ matrix.arch }} 2>&1 | tee package.log || {
            tail -n 60 package.log | python3 -c '
          import sys
          lines = [l.rstrip() for l in sys.stdin]
          for i in range(0, len(lines), 15):
              text = "\n".join(lines[i:i + 15]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Linux build failed (lines {i + 1}-{i + 15} of the last 60)::{text}")
          '
            exit 1
          }

      # The tests use the same Hamlib that goes into the packages, and a real sound server with a
      # test output and a test input that hears it (for the Linux sound tests).
      - name: Run the tests
        run: |
          pulseaudio -D --exit-idle-time=-1 -n -L module-native-protocol-unix \
            -L "module-null-sink sink_name=rfpix_test_out" \
            -L "module-remap-source source_name=rfpix_test_in master=rfpix_test_out.monitor"
          dotnet build tests/RFpix.Tests/RFpix.Tests.csproj -c Release
          for dir in tests/RFpix.Tests/bin/Release/*/; do cp build/linux-${{ matrix.arch }}/publish/libhamlib.so.4 "$dir"; done
          RFPIX_PULSE_TEST=1 dotnet test tests/RFpix.Tests/RFpix.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Count the tests
        if: always()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("test-results/**/*.trx", recursive=True):
              root = ET.parse(f).getroot()
              c = root.find("t:ResultSummary/t:Counters", ns)
              failed = [r for r in root.iterfind(".//t:UnitTestResult", ns) if r.get("outcome") == "Failed"]
              print(f"::notice title=Linux (${{ matrix.arch }}) tests::{c.get('passed')} of {c.get('total')} passed")
              for r in failed:
                  m = r.find(".//t:Message", ns)
                  text = (m.text or "").replace("\n", " ") if m is not None else ""
                  print(f"::error title=Linux test failed: {r.get('testName')}::{text}")

      # Install the .deb, start RFpix for 20 seconds on a screen of its own, install it again on
      # top (as an update does); then start the AppImage the same way.
      - name: Test the packages
        run: |
          deb=$(ls dist/rfpix_*_${{ matrix.deb }}.deb)
          sudo apt-get install -y -q "./$deb"
          for f in RFpix libhamlib.so.4 RFpix.dll; do
            test -f "/opt/rfpix/$f" || { echo "::error::After installing the .deb, /opt/rfpix/$f is missing."; exit 1; }
          done
          test -L /usr/bin/rfpix && test -f /usr/share/applications/rfpix.desktop
          started() {   # $1: what was started; the rest: the command
            what="$1"; shift
            set +e; xvfb-run -a timeout 20 "$@" > start.log 2>&1; code=$?; set -e
            if [ $code -eq 124 ]; then echo "$what started and kept running."
            else echo "::warning title=Linux start-up ($what)::RFpix stopped within 20 seconds (exit $code):"; cat start.log; fi
          }
          started ".deb" rfpix
          sudo dpkg -i "$deb"
          test -f /opt/rfpix/RFpix || { echo "::error::Installing the .deb again (an update) lost RFpix."; exit 1; }
          appimage=$(ls dist/RFpix-*-linux-${{ matrix.arch }}.AppImage)
          started "AppImage" env APPIMAGE_EXTRACT_AND_RUN=1 "./$appimage"
          echo "Packages installed and started."

      - name: Keep the packages for download
        uses: actions/upload-artifact@v6
        with:
          name: RFpix-linux-${{ matrix.arch }}
          path: |
            dist/RFpix-*-linux-${{ matrix.arch }}.AppImage
            dist/rfpix_*_${{ matrix.deb }}.deb

      - name: Add to the Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          for i in $(seq 1 60); do
            gh release view "$tag" > /dev/null 2>&1 && break
            echo "Waiting for the release $tag to exist..."; sleep 30
          done
          gh release upload "$tag" dist/RFpix-*-linux-${{ matrix.arch }}.AppImage dist/rfpix_*_${{ matrix.deb }}.deb --clobber
